name: Deploy web build to GitHub Pages

# Builds the WebAssembly bundle (web/build.sh) and publishes build/web/ to
# GitHub Pages. Runs on pushes to the default branch, or on demand.
# One-time: enable Pages for the repo with "Source: GitHub Actions"
# (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: web-wasm

      - name: System deps (binaryen for wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install wasm-bindgen-cli (match the wasm-bindgen crate version)
        run: |
          VER=$(cargo metadata --format-version=1 --filter-platform wasm32-unknown-unknown 2>/dev/null \
            | grep -o '"wasm-bindgen [0-9.]*"' | head -1 | grep -o '[0-9.]*')
          echo "wasm-bindgen crate version: ${VER:-unknown}"
          cargo install wasm-bindgen-cli --version "${VER:-0.2.126}" --locked

      - name: Build web bundle
        run: bash web/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
