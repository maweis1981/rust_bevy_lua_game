<!DOCTYPE html>
<html lang="en">
<head>
  <!-- TikTok Mini Games JSSDK — MUST be the first tag after <head>, from this
       exact host (the DevTools validates this). Native audio, ads, loading
       progress, storage all hang off TTMinis.game.* -->
  <script src="https://connect.tiktok-minis.com/game/sdk.js"></script>
  <script>
    // Init right after the SDK per the docs. Guarded so a plain-browser preview
    // (SDK absent) doesn't throw. TODO(ship): put your real client key here.
    if (typeof TTMinis !== 'undefined' && TTMinis.game && TTMinis.game.init) {
      try { TTMinis.game.init({ clientKey: 'YOUR_TIKTOK_CLIENT_KEY' }); } catch (e) {}
    }
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Time Dodge</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #080b1a; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
</head>
<!--
  tiktok/index.html — TikTok Mini Games entry (HTML runtime).

  Unlike WeChat/Douyin mini-GAMES (no DOM, wx/tt.createCanvas), TikTok Minis'
  HTML runtime is a real webview: normal <canvas>, document/window, DOM touch
  events, localStorage. So the SAME platform-agnostic shared/ engine runs here
  directly — only the adapter differs (adapter.js, DOM + TTMinis.game.*).
  See README "TikTok (TTMinis) build", RESEARCH §8, and minigame.config.json.
-->
<body>
  <canvas id="game"></canvas>

  <!-- The engine bundle is generated by ../prepare.sh from the canonical
       shared/ sources (a tiny inline CommonJS registry wraps each module so the
       browser can require() them, keeping shared/*.js byte-for-byte identical
       across WeChat/Douyin/TikTok). It is gitignored — run prepare.sh first. -->
  <script src="engine.bundle.js"></script>
  <script src="adapter.js"></script>
  <script>
    (function () {
      'use strict';
      // The HTML runtime loads the whole page up front; report a simple 0→1
      // progress so TikTok can show its native loading UI, then start.
      function report(p) {
        if (typeof TTMinis !== 'undefined' && TTMinis.game && TTMinis.game.setLoadingProgress) {
          try { TTMinis.game.setLoadingProgress({ progress: p }); } catch (e) {}
        }
      }
      report(0.5);

      var platform = window.createTikTokPlatform();   // from adapter.js
      var startGame = window.require('main.js').startGame;
      startGame(platform);
      report(1);
    })();
  </script>
</body>
</html>
