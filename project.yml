# XcodeGen spec. Regenerate the .xcodeproj with: xcodegen generate
# (or `make ios-project`). The project is git-ignored and fully derived from here.
name: hollowlullaby
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

targets:
  hollowlullaby:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      # App icon catalog (AppIcon.appiconset). Required for TestFlight/App Store.
      - path: ios/Assets.xcassets
      # Folder reference: the whole `assets/` tree is copied into the app bundle
      # as `assets/`, which is where Bevy's iOS asset reader looks.
      - path: assets
        type: folder
        buildPhase: resources
    # Generated Info.plist. `info.properties` lets us set arbitrary keys that the
    # GENERATE_INFOPLIST_FILE / INFOPLIST_KEY_* mechanism does not support — namely
    # CADisableMinimumFrameDurationOnPhone, which unlocks ProMotion (up to 120 Hz;
    # iOS otherwise caps rendering at 60 fps).
    info:
      path: ios/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        # Friendly home-screen name (change freely).
        CFBundleDisplayName: Mini Games
        # Export-compliance: the app uses no non-exempt encryption, so App Store
        # Connect won't prompt for an encryption declaration on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Render edge-to-edge: hide the status bar and take the whole screen so
        # the background fills the top notch / bottom home-indicator (no black bars).
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngmob.hollow
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Code signing for physical devices (automatic provisioning).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4JFR4NTMKQ
        CODE_SIGN_IDENTITY: "Apple Development"
        # The Rust lib is arm64 only (device + Apple-Silicon simulator). Pin the
        # build to arm64 so Xcode doesn't try to link an x86_64 simulator slice.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ENABLE_BITCODE: NO
        # Use the AppIcon set from ios/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Link the Rust static library produced by the pre-build script.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/ios
        OTHER_LDFLAGS:
          - $(inherited)
          - -lhollowlullaby
    preBuildScripts:
      - name: Build Rust static library
        script: bash "$SRCROOT/ios/build_rust.sh" "$SRCROOT/build/ios"
        basedOnDependencyAnalysis: false
    # System frameworks required by wgpu (Metal), winit (UIKit), and Bevy audio.
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
